name: vyaya_capture
description: Captures payment-app notifications and bank SMS for Vyaya (Android only).
version: 1.0.0
publish_to: none

environment:
  sdk: ^3.9.2
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter

flutter:
  plugin:
    platforms:
      android:
        package: com.vyaya.capture
        pluginClass: VyayaCapturePlugin
