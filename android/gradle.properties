org.gradle.jvmargs=-Xmx4096M -XX:MaxMetaspaceSize=512M -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
kotlin.code.style=official
org.gradle.configuration-cache=false
org.gradle.daemon=true
org.gradle.parallel=true

# Fix JVM target for all Kotlin compilation tasks
kotlin.jvm.target.validation.mode=warning

# Disable Kotlin incremental compilation to fix path resolution issues
kotlin.incremental=false
kotlin.incremental.android=false
kotlin.incremental.useClasspathSnapshot=false

# Enable R8 full mode
android.enableR8.fullMode=false

# Disable problematic build features that cause cache corruption
android.enableBuildCache=false
android.enableD8.desugaring=true

# Memory and performance optimization
org.gradle.caching=false
org.gradle.configureondemand=false
org.gradle.workers.max=4

# Fix for Kotlin compilation issues
kotlin.compiler.execution.strategy=in-process
org.gradle.unsafe.configuration-cache=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
